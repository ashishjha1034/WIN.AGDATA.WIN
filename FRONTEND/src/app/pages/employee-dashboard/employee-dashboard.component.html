<div class="employee-container">
  <nav class="navbar">
    <div class="navbar-left">
      <h1 class="navbar-brand">WIN.AGDATA</h1>
      <span class="badge badge-employee">Employee</span>
    </div>
    <div class="navbar-right">
      <span class="user-info">{{ userName }} ({{ userEmail }})</span>
      <button class="btn-logout" (click)="logout()">Logout</button>
    </div>
  </nav>

  <div class="dashboard-content">
    <h2>Employee Dashboard</h2>
    <p>Welcome to your dashboard, {{ userName }}!</p>
    <p>Here you can:</p>
    <ul>
      <li>View your reward points balance</li>
      <li>Check points history</li>
      <li>Browse and redeem products</li>
      <li>Track your redemption status</li>
    </ul>
  </div>
</div>
