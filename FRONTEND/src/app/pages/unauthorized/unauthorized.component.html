<div class="unauthorized-container">

        <path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/>
      </svg>
    </div>
    <h1>Access Denied</h1>

    <div class="action-buttons">
      <button class="btn btn-primary" (click)="goHome()">Return to Login</button>
    </div>
  </div>
</div>
