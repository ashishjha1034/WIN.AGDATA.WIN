<div class="user-page-wrapper">
  <app-user-sidebar></app-user-sidebar>

  <div class="user-page-main">
    <div class="page-header">
      <div class="search-container">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <circle cx="11" cy="11" r="8"></circle>
          <path d="m21 21-4.35-4.35"></path>
        </svg>
        <input type="text" class="search-input" placeholder="Search..." [(ngModel)]="searchQuery" />
      </div>

      <div class="header-right">
        <div class="user-menu">
          <span class="user-label">Employee</span>
          <div class="user-avatar-small">
            {{ currentUser?.firstName?.charAt(0) || '' }}{{ currentUser?.lastName?.charAt(0) || '' }}
          </div>
        </div>
        <button class="logout-btn" (click)="logout()">Logout</button>
      </div>
    </div>

    <div class="page-content">
      <h1 class="page-title">Redemptions</h1>

      <div *ngIf="isLoading" class="loading-indicator">
        <div class="spinner"></div>
        <p>Loading redemptions...</p>
      </div>

      <div class="redemptions-list" *ngIf="!isLoading && redemptions.length > 0">
        <div class="redemption-item" *ngFor="let redemption of redemptions">
          <h3>{{ redemption.productName }}</h3>
          <p>{{ redemption.pointsSpent }} Points</p>
          <p>Status: {{ redemption.status }}</p>
        </div>
      </div>

      <div *ngIf="!isLoading && redemptions.length === 0" class="empty-state">
        <p>No redemptions yet</p>
      </div>
    </div>
  </div>
</div>
