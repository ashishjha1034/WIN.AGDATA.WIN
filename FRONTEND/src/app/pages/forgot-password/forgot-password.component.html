<div class="forgot-password-container">
  <div class="forgot-password-sidebar">
    <div class="logo-container">
      <img src="assets/login-sidebar-image.png" alt="AGDATA Decorative Background" class="sidebar-image" />
      <div class="logo-overlay">
        <img src="assets/brand/agdata-logo-white.png" alt="AGDATA Logo" class="agdata-logo-overlay" />
      </div>
    </div>
  </div>

  <div class="forgot-password-main">
    <div class="forgot-password-box">
      <h1>Reset Password</h1>

      <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()" *ngIf="!success">
        <!-- Email Field -->
        <div class="form-group">
          <label for="email">Email address</label>
          <div class="input-wrapper">
            <input
              id="email"
              type="email"
              formControlName="email"
              placeholder="name.lastname&#64;agdata.com"
              class="form-input"
              [class.input-error]="emailControl?.invalid && emailControl?.touched"
            />
            <svg *ngIf="emailControl?.valid && emailControl?.touched" class="check-icon" viewBox="0 0 24 24" fill="currentColor">
              <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/>
            </svg>
          </div>
          <div *ngIf="emailControl?.invalid && emailControl?.touched" class="error-text">
            <span *ngIf="emailControl?.hasError('required')">Email is required</span>
            <span *ngIf="emailControl?.hasError('email')">Please enter a valid email</span>
            <span *ngIf="emailControl?.hasError('corporateEmail')">Must end with &#64;agdata.com</span>
            <span *ngIf="emailControl?.hasError('corporateEmailLocalPart')">At least 5 characters before &#64;agdata.com</span>
          </div>
        </div>

        <!-- Submit Button -->
        <button
          type="submit"
          class="btn-submit"
          [disabled]="forgotForm.invalid || loading"
        >
          <span *ngIf="!loading">Send Reset Link</span>
          <span *ngIf="loading" class="spinner">
            <span class="spinner-dot"></span>
            Sending...
          </span>
        </button>
      </form>

      <!-- Success Message (simplified) -->
      <div *ngIf="success" class="success-container">
        <div class="success-icon">
          <i class="fa-solid fa-envelope-circle-check"></i>
        </div>
        <p class="success-text">Email sent, redirecting to login...</p>
      </div>

      <!-- Back to Login -->
      <div class="back-to-login">
        <a (click)="navigateToLogin()" class="link" tabindex="0" (keydown.enter)="navigateToLogin()">
          <i class="fa-solid fa-arrow-left"></i> Back to sign in
        </a>
      </div>
    </div>
  </div>
</div>
