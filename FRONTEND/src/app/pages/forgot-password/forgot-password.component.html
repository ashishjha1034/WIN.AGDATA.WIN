<div class="forgot-password-container">
  <div class="forgot-password-sidebar">
    <div class="logo-container">
      <svg class="agdata-logo" viewBox="0 0 200 100" xmlns="http://www.w3.org/2000/svg">
        <text x="10" y="70" font-size="60" font-weight="bold" fill="#ffffff">AGDATA</text>
      </svg>
    </div>
  </div>

  <div class="forgot-password-main">
    <div class="forgot-password-box">
      <h1>Forgot Password?</h1>
      <p class="subtitle">No problem! Enter your email and we'll send you a link to reset your password.</p>

      <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()" *ngIf="!success">
        <!-- Error Message -->
        <div *ngIf="error" class="error-message" role="alert">
          <svg class="error-icon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
          </svg>
          {{ error }}
        </div>

        <!-- Email Field -->
        <div class="form-group">
          <label for="email">Email address</label>
          <div class="input-wrapper">
            <input
              id="email"
              type="email"
              formControlName="email"
              placeholder="your.email@example.com"
              class="form-input"
              [class.input-error]="emailControl?.invalid && emailControl?.touched"
            />
            <svg *ngIf="emailControl?.valid && emailControl?.touched" class="check-icon" viewBox="0 0 24 24" fill="currentColor">
              <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/>
            </svg>
          </div>
          <div *ngIf="emailControl?.invalid && emailControl?.touched" class="error-text">
            <span *ngIf="emailControl?.hasError('required')">Email is required</span>
            <span *ngIf="emailControl?.hasError('email')">Please enter a valid email</span>
          </div>
        </div>

        <!-- Submit Button -->
        <button
          type="submit"
          class="btn-submit"
          [disabled]="forgotForm.invalid || loading"
        >
          <span *ngIf="!loading">Send Reset Link</span>
          <span *ngIf="loading" class="spinner">
            <span class="spinner-dot"></span>
            Sending...
          </span>
        </button>
      </form>

      <!-- Success Message -->
      <div *ngIf="success" class="success-container">
        <div class="success-icon">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/>
          </svg>
        </div>
        <h2>Check Your Email</h2>
        <p>{{ successMessage }}</p>
        <p class="info-text">Redirecting to login in 3 seconds...</p>
      </div>

      <!-- Back to Login -->
      <div class="back-to-login">
        <p>Remember your password? <a (click)="navigateToLogin()" class="link">Back to sign in</a></p>
      </div>
    </div>
  </div>
</div>
